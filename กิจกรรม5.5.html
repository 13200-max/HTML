<title>การแสดงรายการโดยใช้ตัวเลขเรียงลำดับ</title>
</head>
<body>
<ol type=i start=2><b>เลือกให้เป็น</b>
    <li>ถึงยามได้ ได้ให้ดี ไม่ทุกข์
    <li>ถึงยามเป็น เป็นให้ถูก ตามวิถี
    <li>ถึงยามตาย ตายอย่างเป็น เห็นสุดดี
    <li>ได้อย่างนี้ ไม่มีทุกข์ ทุกเวลา
</ol>
</body>
